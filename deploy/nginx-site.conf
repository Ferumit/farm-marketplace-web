# nginx config for example.kz
#
# Apply from the server (the repo is already deployed there):
#   sudo cp /var/www/example.kz/html/deploy/nginx-site.conf /etc/nginx/sites-available/example.kz
#   sudo nginx -t && sudo systemctl reload nginx
#
# ---------------------------------------------------------------------------------------------
# Caching
#
# Deliberately inverted: everything revalidates EXCEPT static media. The site ships unversioned
# .js modules, so a fresh page against a stale module fails hard ("does not provide an export
# named X") and shows a blank screen. `no-cache` still caches - it just forces a cheap ETag
# revalidation that returns 304.
#
# The default has to be the safe one because of the clean URLs below: /lots has no extension, so
# a rule keyed on `\.html$` would leave every page in the site with no Cache-Control at all and
# hand it to the browser's heuristic caching. Media is the only thing safe to pin, and it is
# named explicitly.
#
# It lives in a map rather than a nested location because an `add_header` inside a location block
# discards every add_header inherited from the server block - which would strip the security
# headers below from exactly the responses that need them most.
# ---------------------------------------------------------------------------------------------
map $uri $et_cache_control {
    default                                                  "no-cache, must-revalidate";
    ~*\.(?:png|jpe?g|gif|webp|svg|ico|woff2?|ttf|otf|eot|mp4)$ "public, max-age=2592000";
}

server {
    server_name example.kz www.example.kz;
    root /var/www/example.kz/html;
    index index.html;

    add_header Cache-Control $et_cache_control always;

    # `always` matters: without it these are attached only to 2xx/3xx, so error pages - including
    # the 404s an attacker probes for - would come back unprotected.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A Content-Security-Policy is deliberately NOT enabled yet. The site pulls the Firebase SDK
    # from gstatic, fonts from Google Fonts, and phone sign-in renders reCAPTCHA in iframes from
    # www.google.com - a policy that misses any one of those breaks login on a live pilot rather
    # than merely logging a warning. The starting point below covers every origin the site
    # currently talks to; enable it only after clicking through login, ordering and the partner
    # cabinet with the console open.
    #
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://www.google.com https://farm-marketplace-demo.firebaseapp.com; connect-src 'self' https://*.googleapis.com https://*.cloudfunctions.net" always;

    # -----------------------------------------------------------------------------------------
    # Clean URLs
    #
    # A .html suffix leaks the implementation into the address bar: it tells the world these are
    # files on disk, ties every public link to the current stack, and breaks every one of those
    # links the day the stack changes. The pages keep their filenames on disk - only the address
    # changes, and nginx maps one to the other.
    #
    # A rewrite picks the file to serve; it does NOT hand the browser a query string, so
    # location.search is empty on /lots/{id} and reading ?id= there returns null. The pages read
    # the path first and fall back to the query (data.js routeId), which is what keeps the 301s
    # from the old ?id= addresses working.
    # -----------------------------------------------------------------------------------------
    rewrite ^/lots/([^/]+)/split/?$  /lot.html?id=$1&mode=split  last;
    rewrite ^/lots/([^/]+)/?$        /lot.html?id=$1             last;
    rewrite ^/farmers/([^/]+)/?$     /farmer.html?id=$1          last;
    rewrite ^/orders/([^/]+)/?$      /order.html?lotId=$1        last;

    # The farmer cabinet reads as sections rather than as files sharing a "partner-" prefix.
    rewrite ^/cabinet/lots/new/?$    /partner-lot-editor.html    last;
    rewrite ^/cabinet/lots/?$        /partner-lots.html          last;
    rewrite ^/cabinet/orders/?$      /partner-orders.html        last;
    rewrite ^/cabinet/animals/?$     /partner-animals.html       last;
    rewrite ^/cabinet/delivery/?$    /partner-traceability.html  last;

    # Canonical redirects from the old addresses - but ONLY for pages that are reached through
    # try_files, never for one that a rewrite above lands on. This took the site down once and
    # the reason is worth stating plainly:
    #
    #   `rewrite ... last` makes nginx search for a location AGAIN with the rewritten URI. So
    #   /lots/{id} rewrote to /lot.html, matched `location = /lot.html`, and was 301'd straight
    #   back to /lots/{id}. Every detail page and the whole cabinet looped. try_files does not
    #   do that - a file argument is served in the current context with no second location
    #   search - which is why the pages below are safe and the rewritten ones are not.
    #
    # So /lot.html, /farmer.html and /partner-*.html keep serving their own content instead of
    # redirecting. Two addresses for one page is a cosmetic cost; a dead site is not.
    #
    # `/` is served explicitly rather than through the `index` directive, which answers a request
    # for / with an INTERNAL redirect to /index.html - and that one DOES re-match locations, so
    # the canonical redirect below sent it straight back to /. That was the first loop.
    location = / { try_files /index.html =404; }

    # Регистрация разведена по ролям: свой адрес на каждую. /register/partner — это то, что
    # напечатано на листовке с QR: короче, чем /register?role=partner, и его не обрежет
    # мессенджер. Страница одна и та же, роль register.js читает из ПУТИ.
    #
    # Именно try_files, а не rewrite: rewrite ... last заставил бы nginx искать location заново,
    # он попал бы в `location = /register.html` ниже и 301-нул человека на /register — то есть
    # ровно туда, где роль снова спрашивают. Тот же капкан, что однажды закольцевал весь сайт.
    location = /register/partner { try_files /register.html =404; }
    location = /register/buyer   { try_files /register.html =404; }
    location = /index.html    { return 301 /; }
    location = /lots.html     { return 301 /lots; }
    location = /farmers.html  { return 301 /farmers; }
    location = /login.html    { return 301 /login$is_args$args; }
    location = /register.html { return 301 /register$is_args$args; }
    location = /profile.html  { return 301 /profile; }
    location = /orders.html   { return 301 /orders; }
    location = /offer.html          { return 301 /offer; }
    location = /payment-refund.html { return 301 /payment-refund; }
    location = /privacy.html        { return 301 /privacy; }

    # -----------------------------------------------------------------------------------------
    # Things that must never be served
    #
    # The site is deployed by `git reset --hard` INTO this web root, so .git sits right here -
    # and nginx served it: /.git/HEAD, config, refs, logs and index all returned 200, which is
    # everything git-dumper needs to rebuild the whole repository and its full history. No
    # credentials were in it (the remote is SSH and the key lives in ~/.ssh, outside the root),
    # but any secret ever committed and later deleted would be recoverable from the history.
    #
    # 404 rather than 403: a 403 confirms the path exists. The lookahead keeps /.well-known/
    # reachable, because certbot renews through it - blocking it would let the certificate
    # silently expire in three months.
    # -----------------------------------------------------------------------------------------
    location ~ /\.(?!well-known/) { return 404; }
    location ^~ /deploy/ { return 404; }
    # The admin panel is served ONLY from admin.example.kz, behind its own password and on its
    # own origin. Reachable here it would be neither - and an XSS anywhere on the public site
    # would run with an administrator's session.
    location ^~ /admin/ { return 404; }

    # $uri.html is what turns /lots into lots.html. It comes after $uri so a real file still wins.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/example.kz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/example.kz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.example.kz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = example.kz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name example.kz www.example.kz;
    return 404; # managed by Certbot
}

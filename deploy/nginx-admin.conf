# nginx config for admin.example.kz - the staff panel.
#
# Kept apart from the public site on purpose:
#   - its own ORIGIN. A Firebase session lives in the IndexedDB of the domain it signed in on, so
#     a staff session on example.kz would share storage with every public page, and an XSS on any
#     of them would run with administrator rights. On its own origin it cannot be reached.
#   - a password in front of everything, so to a stranger not even the HTML exists.
#   - never indexed, never framed, never cached.
#
# None of this is the real security - the Firestore rules and the Cloud Functions are, and they
# assume the whole panel's source is public. This is the outer layer.
#
# One-time setup on the server (in an interactive `ssh на сервер` session, not through PowerShell):
#   sudo htpasswd -c /etc/nginx/.htpasswd-admin <username>      (prompts for the password)
#   sudo cp /var/www/example.kz/html/deploy/nginx-admin.conf /etc/nginx/sites-available/admin.example.kz
#   sudo ln -s /etc/nginx/sites-available/admin.example.kz /etc/nginx/sites-enabled/admin.example.kz
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d admin.example.kz
#
# This file is a copy of the INSTALLED config after certbot ran (2026-09-21): certbot moved the
# port-80 listener into its own redirect block and added the ssl lines below. Keep it in sync -
# copying an older version over the installed one would silently drop HTTPS.

server {
    server_name admin.example.kz;

    # The panel lives inside the public repo; the public host returns 404 for /admin/.
    root /var/www/example.kz/html/admin;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    # Staff screens show buyers' phones and addresses - nothing of it should linger in a cache.
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location ~ /\. { return 404; }

    # The password sits on THIS location rather than the whole server block, and that is
    # deliberate. certbot proves domain ownership by inserting its own exact-match location for
    # /.well-known/acme-challenge/ - on first issue and on every renewal. A server-level
    # auth_basic would be inherited by that location, the challenge would get a 401, and the
    # certificate would quietly expire three months later.
    location / {
        auth_basic "ET";
        auth_basic_user_file /etc/nginx/.htpasswd-admin;
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.example.kz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.example.kz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = admin.example.kz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name admin.example.kz;
    return 404; # managed by Certbot


}
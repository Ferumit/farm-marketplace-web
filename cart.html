<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){try{var t=localStorage.getItem('et-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script>
<title>Корзина — ET</title>
<meta name="description" content="Корзина ET: отложенные туши и полутуши от фермерских хозяйств Казахстана — оформите заказ одним шагом.">
<link rel="icon" href="/assets/icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<style>
  .cart-layout { display:grid; gap:24px; grid-template-columns: 1fr; align-items:start; }
  @media (min-width: 960px) { .cart-layout { grid-template-columns: 1.4fr 1fr; } }
  .cart-row { display:flex; gap:14px; padding:16px 0; border-bottom:1px solid var(--line); }
  .cart-row:last-child { border-bottom:none; }
  .cart-row__photo { width:96px; height:72px; flex-shrink:0; border-radius:12px; overflow:hidden; background:var(--fill-track); }
  .cart-row__photo img { width:100%; height:100%; object-fit:cover; display:block; }
  .cart-row__photo .meat-emoji-tile, .cart-row__photo .meat-tile { width:100%; height:100%; }
  .cart-row .grow { min-width:0; }
  .cart-row h4 { margin:0 0 4px; font-size:16px; }
  .cart-row p { margin:0; font-size:13px; color:var(--muted); }
  .cart-row__side { margin-left:auto; text-align:right; display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  .cart-row__price { font-weight:700; white-space:nowrap; }
  .cart-gone { color: var(--danger); font-size:13px; }
</style>
</head>
<body>
  <div id="site-header"></div>

  <div class="container section-tight">
    <span class="eyebrow">Ваши покупки</span>
    <h1 style="margin-top:6px;">Корзина</h1>
    <div id="cart-content">
      <div class="empty-state skeleton" style="height:240px;"></div>
    </div>
  </div>

  <div id="site-footer"></div>
  <script type="module" src="/js/cart-page.js"></script>
</body>
</html>

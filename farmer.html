<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){try{var t=localStorage.getItem('et-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script>
<title>Фермер — ET</title>
<meta name="description" content="Профиль аккредитованного фермерского хаба ET — доступные лоты мяса, совместная покупка, прямая связь с фермером.">
<link rel="icon" href="/assets/icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<style>
  .farmer-hero { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
  .farmer-hero .avatar { width: 96px; height: 96px; border-radius: 24px; object-fit: cover; background: var(--fill-track); }
  .doc-chip { display:inline-flex; align-items:center; gap:6px; font-size:13px; color: var(--ink-dim); border:1px solid var(--line); border-radius: var(--r-pill); padding:8px 14px; }
  .doc-chip--ok { color: var(--green); border-color: var(--green); }
  .farm-about { display: grid; gap: 22px; margin-top: 26px; grid-template-columns: 1fr; }
  @media (min-width: 960px) { .farm-about { grid-template-columns: 1.4fr 1fr; align-items: start; } }
  .farm-desc { white-space: pre-line; max-width: 70ch; margin-top: 0; }
  .farm-video { margin: 0; }
  .farm-video video { display: block; width: 100%; border-radius: var(--r-card); background: #000; }
  .farm-video figcaption { font-size: 13px; color: var(--ink-faint); margin-top: 6px; }
  .farm-terms { display: grid; gap: 14px; }
  .farm-terms h4 { margin: 0; }
  .farm-terms ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 10px; font-size: 14px; }
  .farm-terms .muted { color: var(--ink-faint); font-size: 13px; }
  .meat-emoji-tile { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:40px; background: linear-gradient(135deg, var(--green-tint), var(--rust-tint)); }
</style>
</head>
<body>
  <div id="site-header"></div>

  <div class="container section-tight" id="farmer-hero" >
    <div class="empty-state skeleton" style="height:120px;"></div>
  </div>

  <div class="container section-tight">
    <h2>Туши в продаже</h2>
    <p style="max-width:640px; margin-top:-6px;">Выберите тушу, формат — половину или целую, разделку и доставку.</p>
    <div id="lot-grid" class="grid grid-cards">
      <div class="card-photo skeleton" style="height:320px;"></div>
      <div class="card-photo skeleton" style="height:320px;"></div>
    </div>
  </div>

  <div class="container section-tight" id="farmer-reviews"></div>

  <div id="site-footer"></div>

  <script type="module" src="/js/farmer.js"></script>
</body>
</html>

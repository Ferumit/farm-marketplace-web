<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){try{var t=localStorage.getItem('et-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script>
<title>Совместная покупка — ET</title>
<meta name="description" content="Совместная покупка туши на ET: 2–5 человек делят одну тушу, заказ уходит хозяйству, когда соберутся все.">
<link rel="icon" href="/assets/icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<style>
  .group-layout { display:grid; gap:28px; grid-template-columns: 1fr; }
  @media (min-width: 960px) { .group-layout { grid-template-columns: 1.2fr 1fr; align-items:start; } }
  .seat-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .seat-row:last-child { border-bottom:none; }
  .seat-num {
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    display:inline-flex; align-items:center; justify-content:center;
    background: var(--green-tint); color: var(--green); font-weight:700; font-size:14px;
  }
  .seat-row.free .seat-num { background: var(--fill-track); color: var(--muted); }
  .seat-row .grow { display:flex; flex-direction:column; }
  .seat-row small { color: var(--muted); font-size:12px; }
</style>
</head>
<body>
  <div id="site-header"></div>

  <div class="container section-tight" id="group-content">
    <div class="empty-state skeleton" style="height:360px;"></div>
  </div>

  <div id="site-footer"></div>
  <script type="module" src="/js/group.js"></script>
</body>
</html>

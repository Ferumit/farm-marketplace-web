<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){try{var t=localStorage.getItem('et-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script>
<title>Вход — ET</title>
<link rel="icon" href="/assets/icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<style>
  .auth-wrap { max-width: 420px; margin: 0 auto; }
  .auth-wrap .panel { margin-top: 24px; }
</style>
</head>
<body>
  <div id="site-header"></div>

  <div class="container section auth-wrap">
    <span class="eyebrow">Вход или регистрация</span>
    <h1 style="margin-top:6px;">С тем же номером, что и в приложении</h1>
    <p>Один аккаунт ET работает и в приложении, и на сайте.</p>

    <div class="panel">
      <div class="notice-box notice-icon"><svg class="icon " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" /><path d="m9 12 2 2 4-4" /></svg><span>Введите номер телефона, привязанный к вашему аккаунту ET, для получения кода подтверждения.</span></div>

      <div id="step-phone">
        <div class="field">
          <label>Номер телефона</label>
          <input type="tel" id="phone-input" placeholder="+7 700 000 00 00" autocomplete="tel">
        </div>
        <button class="btn-pill btn-primary btn-block" id="btn-send-code">Получить код →</button>
      </div>

      <div id="step-code" style="display:none;">
        <div class="field">
          <label>Код из SMS</label>
          <input type="text" id="code-input" placeholder="123456" inputmode="numeric" autocomplete="one-time-code">
        </div>
        <button class="btn-pill btn-primary btn-block" id="btn-confirm-code">Подтвердить →</button>
        <button class="btn-pill btn-ghost btn-block" id="btn-change-phone" style="margin-top:10px;">Изменить номер</button>
      </div>

      <p id="auth-error" style="color:var(--danger); display:none; margin-top:14px; margin-bottom:0;"></p>
    </div>

    <p style="margin-top:18px; font-size:14px;">Ещё нет аккаунта? <a href="/register" id="register-link" style="color:var(--green); font-weight:600;">Зарегистрироваться</a></p>
  </div>

  <div id="recaptcha-container"></div>
  <div id="site-footer"></div>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
